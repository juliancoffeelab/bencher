[project]
name = "bencher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dearpygui>=2.2",
    "dearpygui-ext>=2.0.0",
    "matplotlib>=3.10.8",
    "plotly>=6.6.0",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "types-psutil>=7.2.2.20260130",
    "mypy>=1.19.1",
]

[tool.mypy]
exclude = ["src/ron/_generated/"]
python_version = 3.14
warn_unused_configs = true
check_untyped_defs = true
warn_unreachable = true
