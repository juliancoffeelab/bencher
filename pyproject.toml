[project]
name = "bencher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dearpygui>=2.2",
    "dearpygui-ext>=2.0.0",
    "matplotlib>=3.10.8",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "types-psutil>=7.2.2.20260130",
    "mypy>=1.19.1",
]

[project.scripts]
bencher = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[tool.mypy]
python_version = 3.14
warn_unused_configs = true
check_untyped_defs = true
warn_unreachable = true
